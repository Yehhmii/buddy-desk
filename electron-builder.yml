# Installers for Windows and macOS. Run `npm run dist:win` or `npm run dist:mac`.
# File names are fixed (no version number) so a website can link to
#   https://github.com/OWNER/REPO/releases/latest/download/Jarvis-Desk-Setup.exe
appId: com.buddydesk.app
productName: Buddy Desk
npmRebuild: false
copyright: Copyright © Buddy Desk contributors
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - resources/icon.png
  - package.json
asarUnpack:
  - node_modules/tesseract.js/**
  - node_modules/tesseract.js-core/**
  - node_modules/better-sqlite3/**
extraResources:
  - from: resources/tray.png
    to: tray.png
  - from: resources/trayTemplate.png
    to: trayTemplate.png
  - from: resources/trayTemplate@2x.png
    to: trayTemplate@2x.png

# Replace OWNER with your GitHub username or organisation before the first release.
publish:
  provider: github
  owner: yehhmii
  repo: buddy-desk

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.png
  artifactName: Buddy-Desk-Setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  deleteAppDataOnUninstall: false

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: resources/icon.png
  category: public.app-category.productivity
  artifactName: Buddy-Desk-mac-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Buddy Desk listens through the microphone for your voice commands and wake word.
dmg:
  title: Buddy Desk
